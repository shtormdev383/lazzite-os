
name: LAZZITE Debian 12 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin

      - name: Configure LAZZITE
        run: |
          mkdir -p config

          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --binary-images iso-hybrid \
            --bootloader grub \
            --debian-installer live

      - name: Verify configuration
        run: |
          echo "Checking Debian configuration..."
          cat config/bootstrap
          cat config/archives
          grep -R "archive.ubuntu.com" config && exit 1 || true

      - name: Build ISO
        run: |
          lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: LAZZITE-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
