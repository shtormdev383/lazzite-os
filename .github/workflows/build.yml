name: LAZZITE Debian 13 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates \
            xorriso \
            squashfs-tools \
            dosfstools \
            mtools \
            rsync \
            cpio \
            grub-pc-bin \
            grub-efi-amd64-bin

      - name: Build LAZZITE
        run: sudo bash build/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: LAZZITE-13-amd64
          path: dist/LAZZITE-13-amd64.iso
          if-no-files-found: error
          retention-days: 7
