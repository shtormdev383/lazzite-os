name: LAZZITE Debian 13 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie
      options: --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates \
            cpio \
            grub-common \
            grub-pc-bin \
            isolinux \
            rsync \
            squashfs-tools \
            xorriso

      - name: Verify Debian Trixie build environment
        run: |
          . /etc/os-release
          if [ "$VERSION_CODENAME" != "trixie" ]; then
            echo "::error::Expected Debian Trixie build container, got ${PRETTY_NAME}."
            exit 1
          fi
          dpkg-query -W -f='live-build=${Version}\n' live-build
          for tool in lb debootstrap xorriso grub-mkimage mksquashfs; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required build tool is missing: $tool"
              exit 1
            fi
          done

      - name: Build LAZZITE
        run: bash build/build-iso.sh

      - name: Create ISO checksum
        run: |
          cd dist
          sha256sum LAZZITE-13-amd64.iso > LAZZITE-13-amd64.iso.sha256

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: LAZZITE-13-amd64
          path: |
            dist/LAZZITE-13-amd64.iso
            dist/LAZZITE-13-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7
