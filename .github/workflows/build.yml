
name: Build LAZZITE OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates

      - name: Configure Debian Live
        run: |
          mkdir -p config

          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --debootstrap-options "--keyring=/usr/share/keyrings/debian-archive-keyring.gpg" \
            --binary-images iso-hybrid \
            --bootloader grub \
            --debian-installer live

      - name: Verify Debian configuration
        run: |
          echo "Checking generated configuration..."
          cat config/bootstrap
          if grep -R "archive.ubuntu.com" config; then
            echo "ERROR: Ubuntu mirror detected!"
            exit 1
          fi

      - name: Build ISO
        run: |
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: lazzite-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
