name: LAZZITE Debian 13 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates \
            xorriso \
            squashfs-tools \
            dosfstools \
            mtools \
            rsync \
            cpio \
            grub-pc-bin \
            grub-efi-amd64-bin

      - name: Patch live-build Contents index URLs
        run: |
          sudo dpkg-query -W -f='live-build=${Version}\n' live-build
          sudo python3 - <<'PY'
          from pathlib import Path

          script = Path("/usr/lib/live/build/lb_chroot_linux-image")
          contents = script.read_text()
          replacements = {
              "${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz":
                  "${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz",
              "${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz":
                  "${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz",
          }

          for old, new in replacements.items():
              count = contents.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence of {old!r} in {script}, found {count}"
                  )
              contents = contents.replace(old, new, 1)

          if any(old in contents for old in replacements):
              raise SystemExit(f"Unpatched Contents URL remains in {script}")

          script.write_text(contents)
          print(f"Patched both Contents URLs in {script}")
          PY

      - name: Build LAZZITE
        run: sudo bash build/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: LAZZITE-13-amd64
          path: dist/LAZZITE-13-amd64.iso
          if-no-files-found: error
          retention-days: 7
